[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vft-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pywebview>=6.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings",
    "python-dotenv",
    "anthropic>=0.91.0",
    "sse-starlette>=1.8.0",
    "keyring",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/db/migrations/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
