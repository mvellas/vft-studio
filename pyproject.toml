[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vft-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pywebview>=6.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings",
    "python-dotenv",
    "anthropic>=0.91.0",
    "sse-starlette>=1.8.0",
    "keyring",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
